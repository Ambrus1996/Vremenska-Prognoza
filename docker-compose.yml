version: '3.8'

services:
  weather_app:
    # [CHANGED] Use the pre-built image from Docker Hub instead of building locally
    # This ensures the deployed code is exactly what was tested in CI/CD
    image: ambrus1996/weather-app:latest
    
    container_name: weather_app
    restart: always
    
    # [CHANGED] Map port 80 (Host) to 80 (Container) for standard HTTP access
    ports:
      - "80:80"
    
    # Load environment variables (DB credentials, API keys)
    env_file:
      - .env
      
    # Wait for Database to be healthy before starting the app
    depends_on:
      weather_db:
        condition: service_healthy

  weather_db:
    image: mysql:8.0
    container_name: weather_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather
      MYSQL_USER: weather_user
      MYSQL_PASSWORD: weather_pass
    ports:
      - "3306:3306"
    volumes:
      # Persist database data
      - db_data:/var/lib/mysql
      # Initialize schema on first run
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "weather_user", "-pweather_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather_pma:
    image: phpmyadmin/phpmyadmin
    container_name: weather_pma
    restart: always
    environment:
      PMA_HOST: weather_db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      weather_db:
        condition: service_healthy

volumes:
  db_data: