version: '3.8'

services:

  # --- NGINX (Reverse Proxy / Receptionist) ---
  nginx:
    image: nginx:latest
    container_name: weather_nginx
    restart: always
    ports:
      # HTTP Port (Redirects to HTTPS)
      - "80:80"
      # [NEW] HTTPS Port (Secure traffic)
      - "443:443"
    volumes:
      # Mount the Nginx configuration file
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # [NEW] Mount the LetsEncrypt certificates from the host machine
      # This allows Nginx inside the container to read the generated keys
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - weather_app

  # --- APP (The Chef / PHP Application) ---
  weather_app:
    # Use the pre-built image from Docker Hub
    image: ambrus1996/weather-app:latest
    
    container_name: weather_app
    restart: always
    
    # [IMPORTANT] Ports section REMOVED.
    # This container is no longer exposed directly to the internet.
    # It talks only to Nginx via the internal Docker network.
    
    # Load environment variables
    env_file:
      - .env
      
    # Wait for Database to be healthy before starting
    depends_on:
      weather_db:
        condition: service_healthy

  # --- DATABASE (MySQL) ---
  weather_db:
    image: mysql:8.0
    container_name: weather_db
    restart: always
    environment:
      # Ideally, these should also use ${VARIABLES} from .env in the future
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather
      MYSQL_USER: weather_user
      MYSQL_PASSWORD: weather_pass
    ports:
      - "3306:3306"
    volumes:
      # Persist database data so it survives container restarts
      - db_data:/var/lib/mysql
      # Initialize schema on the very first run
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "weather_user", "-pweather_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- PHPMYADMIN (Database GUI) ---
  weather_pma:
    image: phpmyadmin/phpmyadmin
    container_name: weather_pma
    restart: always
    environment:
      PMA_HOST: weather_db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      # Exposed on port 8080 for database management
      - "8080:80"
    depends_on:
      weather_db:
        condition: service_healthy

volumes:
  db_data: