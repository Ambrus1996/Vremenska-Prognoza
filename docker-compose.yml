version: '3.8'

services:

  # --- NGINX (Reverse Proxy / Receptionist) ---
  nginx:
    image: nginx:latest
    container_name: weather_nginx
    restart: always
    ports:
      # HTTP Port (Redirects to HTTPS)
      - "80:80"
      # HTTPS Port (Secure traffic)
      - "443:443"
    volumes:
      # Mount the Nginx configuration file
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount the LetsEncrypt certificates from the host machine
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
     - weather_app

  # --- APP (The Chef / PHP Application) ---
  weather_app:
    # Use the pre-built image from Docker Hub
    image: ambrus1996/weather-app:latest
    container_name: weather_app
    restart: always
    
    # Load environment variables
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      
    # Wait for Database to be healthy before starting
    depends_on:
      weather_db:
        condition: service_healthy

  # --- DATABASE (MySQL) ---
  weather_db:
    image: mysql:8.0
    container_name: weather_db
    restart: always
    environment:
      # [SECURE] Credentials loaded from .env file
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Persist database data
      - db_data:/var/lib/mysql
      # Initialize schema on the very first run
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # [SECURE] Use variables for healthcheck too
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- PHPMYADMIN (Database GUI) ---
  weather_pma:
    image: phpmyadmin/phpmyadmin
    container_name: weather_pma
    restart: always
    environment:
      PMA_HOST: weather_db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      weather_db:
        condition: service_healthy

  # --- PYTHON ANALYTICS (MICROSERVICE) ---
  weather_analytics:
    # [PROD STRATEGY] Build the image directly on the server from the Dockerfile
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: weather_analytics
    restart: always
    # [IMPORTANT] No 'volumes' mapping for code. Code is baked into the image.
    
    # [SECURE] Map environment variables from .env to what Python expects
    environment:
      DB_HOST: weather_db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      weather_db:
        condition: service_healthy
    # Keep container running for now
    command: tail -f /dev/null

volumes:
  db_data: