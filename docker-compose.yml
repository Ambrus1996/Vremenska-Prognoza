version: '3.8'

services:

  # --- NGINX (Reverse Proxy / Receptionist) ---
  nginx:
    image: nginx:latest
    container_name: weather_nginx
    restart: always
    ports:
      # HTTP Port (Redirects to HTTPS)
      - "80:80"
      # [NEW] HTTPS Port (Secure traffic)
      - "443:443"
    volumes:
      # Mount the Nginx configuration file
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # [NEW] Mount the LetsEncrypt certificates from the host machine
      # This allows Nginx inside the container to read the generated keys
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - weather_app

  # Trigger deployment refresh
  # --- APP (The Chef / PHP Application) ---
  weather_app:
    # Use the pre-built image from Docker Hub
    image: ambrus1996/weather-app:latest
    
    container_name: weather_app
    restart: always
    
    # [IMPORTANT] Ports section REMOVED.
    # The app is hidden and accessible only via Nginx through the internal Docker network.
    
    # Load environment variables
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      
    # Wait for Database to be healthy before starting
    depends_on:
      weather_db:
        condition: service_healthy

  # --- DATABASE (MySQL) ---
  weather_db:
    image: mysql:8.0
    container_name: weather_db
    restart: always
    environment:
      # [SECURE] Credentials loaded from .env file (Mentor requirement)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Persist database data so it survives container restarts
      - db_data:/var/lib/mysql
      # Initialize schema on the very first run
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # [SECURE] Use variables for healthcheck too
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- PHPMYADMIN (Database GUI) ---
  weather_pma:
    image: phpmyadmin/phpmyadmin
    container_name: weather_pma
    restart: always
    environment:
      PMA_HOST: weather_db
      PMA_USER: root
      # [SECURE] Use the variable for root password
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      # Exposed on port 8080 for database management
      - "8080:80"
    depends_on:
      weather_db:
        condition: service_healthy

volumes:
  db_data: