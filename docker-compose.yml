services:
  weather_app:
    build: .
    container_name: weather_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - weather_db

  weather_db:
    image: mysql:8.0
    container_name: weather_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather
      MYSQL_USER: weather_user
      MYSQL_PASSWORD: weather_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  weather_pma:
    image: phpmyadmin/phpmyadmin
    container_name: weather_pma
    restart: always
    environment:
      PMA_HOST: weather_db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
       - weather_db

volumes:
  db_data:
