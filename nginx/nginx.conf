events {
    # Maximum number of simultaneous connections that can be opened by a worker process
    worker_connections 1024;
}

http {
    # Define the group of servers we are proxying to (our PHP application)
    upstream weather-backend {
        # "weather_app" is the service name defined in docker-compose.yml
        server weather_app:80;
    }

    # --- HTTP Block (Port 80) ---
    # Redirects all HTTP traffic to HTTPS for security
    server {
        listen 80;
        server_name 13.53.32.202.nip.io;

        location / {
            # 301 Redirect: Permanent redirect to the HTTPS version
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS Block (Port 443) ---
    # Handles secure traffic using SSL certificates
    server {
        listen 443 ssl;
        # Enable HTTP/2 for better performance
        http2 on; 
        
        server_name 13.53.32.202.nip.io;

        # --- SSL Certificate Configuration ---
        # Paths point to the volume mounted in docker-compose (read from the host machine)
        ssl_certificate /etc/letsencrypt/live/13.53.32.202.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/13.53.32.202.nip.io/privkey.pem;

        # --- Security Best Practices ---
        # Use only secure TLS versions
        ssl_protocols TLSv1.2 TLSv1.3;
        # Use high strength ciphers
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # Forward the request to the "weather-backend" upstream
            proxy_pass http://weather-backend;
            
            # Forward real client IP and protocol headers to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Tell the backend that the request came via HTTPS
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}