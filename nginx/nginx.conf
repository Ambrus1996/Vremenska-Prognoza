events {
    worker_connections 1024;
}

http {
    # Define the group of servers we are proxying to
    upstream weather-backend {
        # "weather_app" is the name of your service in docker-compose
        server weather_app:80;
    }

    server {
        # Listen on port 80 (HTTP)
        listen 80;
        
        # Your magic domain (Replace IP if it changed, but for now use this)
        server_name 51.20.141.99.nip.io;

        location / {
            # Pass the request to the "Chef" (Apache/PHP)
            proxy_pass http://weather-backend;
            
            # Forward the real IP of the visitor to PHP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}