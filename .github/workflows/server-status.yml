name: Server - Status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Live HTTPS check (from internet)
        run: |
          echo | timeout 15 openssl s_client -connect 13.53.32.202.nip.io:443 -servername 13.53.32.202.nip.io 2>/dev/null \
            | openssl x509 -noout -subject -enddate || echo "HTTPS NE ODGOVARA"
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" --max-time 15 https://13.53.32.202.nip.io/ || true

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Server details via SSM
        run: |
          cat > params.json <<'EOF'
          {"commands":[
            "echo === CERTBOT STILL RUNNING?; pgrep -af certbot || echo none",
            "echo === NGINX; docker ps -a --filter name=weather_nginx --format '{{.Names}} {{.Status}}'",
            "echo === CERT; certbot certificates 2>&1 | grep -E 'Certificate Name|Expiry'",
            "echo === LETSENCRYPT LOG; tail -n 25 /var/log/letsencrypt/letsencrypt.log"
          ]}
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::SSM komanda nije uspela: $STATUS"; exit 1; }
