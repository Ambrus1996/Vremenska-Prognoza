name: Server - Cert Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Instance state
        run: |
          aws ec2 describe-instances --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].[State.Name,PublicIpAddress]' \
            --output text || echo "Nema ec2:Describe dozvolu - nije bitno"

      - name: Diagnostics via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo === PUBLIC IP; curl -s https://checkip.amazonaws.com",
              "echo === CERTS; sudo certbot certificates 2>&1 || echo NO_CERTBOT",
              "echo === RENEWAL METHOD; sudo grep -h authenticator /etc/letsencrypt/renewal/*.conf 2>&1",
              "echo === CONTAINERS; cd /home/ec2-user/vremenska-prognoza/Vremenska-Prognoza && sudo docker-compose ps 2>&1"
            ]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ secrets.AWS_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
