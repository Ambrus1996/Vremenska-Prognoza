name: CI/CD - Lint, Test, Build, Push, and Deploy

# --- Triggers ---
on:
  # 1. CI runs on Pull Requests targeting 'main'
  pull_request:
    branches: [ main ]
  
  # 2. CI + CD runs on a push (merge) to 'main'
  push:
    branches: [ main ]

  # 3. Allows manual runs from the Actions tab
  workflow_dispatch:

# [FIX] Mentor Request: Restrict permissions (Principle of Least Privilege)
# This ensures the GITHUB_TOKEN only has read access to the repo content.
permissions:
  contents: read

# --- Jobs ---
jobs:
  # --- JOB #1: Check Code Quality ---
  php_lint:
    name: Check PHP Syntax (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: 3. Run PHP Lint
        run: find . -type f -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n 1 php -l

  # --- JOB #2: Run Unit Tests (WITH CACHE) ---
  run_tests:
    name: Run Unit Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: php_lint # Waits for Job #1
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: 3. Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: 4. Install Composer Dependencies (if cache missed)
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress
      - name: 5. Run PHPUnit
        run: vendor/bin/phpunit

  # --- [NEW] JOB #2.5: Scan Composer Vulnerabilities ---
  # This addresses the mentor's request to scan PHP dependencies for known CVEs
  security_php:
    name: Scan Composer Deps
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      
      # Uses the official PHP Security Checker
      - name: 2. Run Local PHP Security Checker
        uses: symfonycorp/security-checker-action@v5
        with:
          lock: ./composer.lock

  # --- JOB #3: Build and Push (WITH DOCKER CACHE) ---
  build_and_push:
    name: Build & Push Docker Image
    # [UPDATE] Now waits for both Unit Tests AND PHP Security Scan
    needs: [run_tests, security_php] 
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 4. Extract Short SHA
        id: vars
        run: echo "sha=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT
      - name: 5. Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ambrus1996/weather-app:latest
            ambrus1996/weather-app:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- JOB #4: Security Scan (OS/Docker) ---
  security_scan:
    name: Scan Image (Trivy)
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      # Must checkout code so Trivy can read the .trivyignore file
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 3. Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ambrus1996/weather-app:${{ needs.build_and_push.outputs.sha }}'
          format: 'table'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          # Point to your ignore file for known/accepted risks
          trivyignores: .trivyignore

  # --- JOB #5: DEPLOYMENT (CD) ---
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: security_scan 
    # Only run deploy on push to main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy via SSM
        run: |
          # [UPDATE] Using the Safe Build command for Amazon Linux
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/vremenska-prognoza/Vremenska-Prognoza",
              "echo \"--- [${{ github.sha }}] Starting Deployment ---\"",
              "git fetch origin main",
              "git reset --hard origin/main",
              "echo \"--- Stopping old containers --- 🛑\"",
              "sudo docker-compose down",
              "echo \"--- Building and Starting new containers (Safe Mode) --- 🚀\"",
              "sudo COMPOSE_DOCKER_CLI_BUILD=0 DOCKER_BUILDKIT=0 docker-compose --env-file .env up -d --build",
              "echo \"--- Deployment Finished Successfully ---\""
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          
          # Wait for the command to finish
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
          
          # Retrieve output logs
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text