# -----------------------------------------------------------------
# Pipeline Name
# -----------------------------------------------------------------
name: CI - Lint, Test, Build, Push, and Scan

# -----------------------------------------------------------------
# Triggers: When to run this pipeline
# -----------------------------------------------------------------
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# -----------------------------------------------------------------
# Jobs: What to do
# -----------------------------------------------------------------
jobs:
  
  php_lint:
    name: Check PHP Syntax (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Run PHP Lint
        run: |
          find . -type f -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n 1 php -l

  run_tests:
    name: Run Unit Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: php_lint

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: 3. Cache Composer dependencies
        id: composer-cache 
        uses: actions/cache@v3
        with:
          path: vendor

          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-compose
      - name: 4. Install Composer Dependencies (if cache missed)
  
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress

     
      - name: 5. Run PHPUnit
        run: vendor/bin/phpunit

  # --- JOB #3: Build and Push 
  build_and_push:
    name: Build & Push Docker Image
    needs: run_tests
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 3. Extract Short SHA
        id: vars
        run: echo "sha=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT
      - name: 4. Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ambrus1996/weather-app:latest
            ambrus1996/weather-app:${{ steps.vars.outputs.sha }}

  # --- JOB #4: Security Scan
  security_scan:
    name: Scan Image (Trivy)
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: 1. Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ambrus1996/weather-app:${{ needs.build_and_push.outputs.sha }}'
          format: 'table'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'