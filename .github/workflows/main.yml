name: CI/CD - Lint, Test, Build, Push, and Deploy

# --- Triggers ---
on:
  # 1. CI runs on Pull Requests targeting 'main'
  pull_request:
    branches:
      - main
  
  # 2. CI + CD runs on a push (merge) to 'main'
  push:
    branches:
      - main

  # 3. Allows manual runs from the Actions tab
  workflow_dispatch:

# --- Jobs ---
jobs:
  # --- JOB #1: Check Code Quality ---
  php_lint:
    name: Check PHP Syntax (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: 3. Run PHP Lint
        run: find . -type f -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n 1 php -l

  # --- JOB #2: Run Unit Tests (WITH CACHE) ---
  run_tests:
    name: Run Unit Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: php_lint # Waits for Job #1
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: 3. Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: 4. Install Composer Dependencies (if cache missed)
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress
      - name: 5. Run PHPUnit
        run: vendor/bin/phpunit

  # --- JOB #3: Build and Push (WITH DOCKER CACHE) ---
  build_and_push:
    name: Build & Push Docker Image
    needs: run_tests # Waits for Job #2
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 4. Extract Short SHA
        id: vars
        run: echo "sha=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT
      - name: 5. Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ambrus1996/weather-app:latest
            ambrus1996/weather-app:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# --- JOB #4: Security Scan ---
  security_scan:
    name: Scan Image (Trivy)
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      # [NEW] Must checkout code so Trivy can read the .trivyignore file
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 3. Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'ambrus1996/weather-app:${{ needs.build_and_push.outputs.sha }}'
          format: 'table'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          # [NEW] Point to your ignore file
          trivyignores: .trivyignore

  # --- JOB #5: DEPLOYMENT (CD) ---
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: security_scan 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0224c6322741fbc71" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/vremenska-prognoza/Vremenska-Prognoza",
              "echo \"--- [${{ github.sha }}] Starting Deployment ---\"",
              "git pull origin main",
              "docker-compose pull",
              "docker-compose up -d",
              "echo \"--- Deployment Finished ---\""
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0224c6322741fbc71"
          
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0224c6322741fbc71" \
            --query 'StandardOutputContent' \
            --output text