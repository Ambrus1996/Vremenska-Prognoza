name: CI - Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Koda
        uses: actions/checkout@v3

      - name: 2. Prijavi se na Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Izdvoj Skraćeni SHA ID
        id: vars
        run: echo "sha=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT

      - name: 4. Izgradi i Gurni Docker sliku
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
         
          tags: |
            ambrus1996/weather-app:latest
            ambrus1996/weather-app:${{ steps.vars.outputs.sha }}