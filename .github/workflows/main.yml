name: CI/CD - Lint, Test, Build, Push, and Deploy

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# [FIX] Mentor Request: Restrict permissions (Principle of Least Privilege)
permissions:
  contents: read

jobs:
  # --- JOB #1: Check Code Quality ---
  php_lint:
    name: Check PHP Syntax (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: find . -type f -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n 1 php -l

  # --- JOB #2: Run Unit Tests ---
  run_tests:
    name: Run Unit Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: php_lint
    steps:
      - uses: actions/checkout@v3
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpunit

  # --- [NEW] JOB #2.5: Scan Composer Vulnerabilities ---
  # This addresses the mentor's request to scan PHP dependencies
  security_php:
    name: Scan Composer Deps
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - uses: actions/checkout@v3
      # Uses the official PHP Security Checker
      - name: Run Local PHP Security Checker
        uses: symfonycorp/security-checker-action@v5
        with:
          lock: ./composer.lock

  # --- JOB #3: Build and Push ---
  build_and_push:
    name: Build & Push Docker Image
    needs: [run_tests, security_php] # Waits for tests AND security scan
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: vars
        run: echo "sha=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ambrus1996/weather-app:latest
            ambrus1996/weather-app:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- JOB #4: Security Scan (OS/Docker) ---
  security_scan:
    name: Scan Image (Trivy)
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'ambrus1996/weather-app:${{ needs.build_and_push.outputs.sha }}'
          format: 'table'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: .trivyignore

  # --- JOB #5: DEPLOYMENT (CD) ---
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: security_scan 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy via SSM
        run: |
          # [FIX] Using Secret for Instance ID instead of hardcoded value
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/vremenska-prognoza/Vremenska-Prognoza",
              "echo \"--- [${{ github.sha }}] Starting Deployment ---\"",
              "git pull origin main",
              "sudo docker-compose pull",
              "sudo docker-compose up -d",
              "echo \"--- Deployment Finished ---\""
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
          
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text