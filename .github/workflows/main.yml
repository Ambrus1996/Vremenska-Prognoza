name: CI - Lint, Test, Build, Push, and Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # --- JOB #1: Check Code Quality ---
  php_lint:
    name: Check PHP Syntax (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Run PHP Lint
        run: find . -type f -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n 1 php -l

  # --- JOB #2: Run Unit Tests (WITH CACHE) ---
  run_tests:
    name: Run Unit Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: php_lint
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: 3. Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: 4. Install Composer Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress
      - name: 5. Run PHPUnit
        run: vendor/bin/phpunit

  # --- JOB #3: Build and Push (SADA SA DOCKER KEŠIRANJEM!) ---
  build_and_push:
    name: Build & Push Docker Image
    needs: run_tests
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3
        
      # --- OVO JE NOVI OBAVEZAN KORAK ZA DOCKER CACHE ---
      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 4. Extract Short SHA
        id: vars
        run: echo "sha=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT

      - name: 5. Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ambrus1996/weather-app:latest
            ambrus1996/weather-app:${{ steps.vars.outputs.sha }}
          # --- OVE DVE LINIJE SU MAGIJA ZA KEŠIRANJE ---
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- JOB #4: Security Scan ---
  security_scan:
    name: Scan Image (Trivy)
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: 1. Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'ambrus1996/weather-app:${{ needs.build_and_push.outputs.sha }}'
          format: 'table'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'