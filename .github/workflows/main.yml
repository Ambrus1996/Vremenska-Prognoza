name: CI/CD - Lint, Test, Build, Push, and Deploy

# --- Triggers ---
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# --- Jobs ---
jobs:
  # --- JOB #1: Check PHP Syntax ---
  php_lint:
    name: Check PHP Syntax (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: 3. Run PHP Lint
        run: find . -type f -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n 1 php -l

  # --- JOB #2: Run Unit Tests ---
  run_tests:
    name: Run Unit Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: php_lint
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: 3. Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: 4. Install Composer Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress
      - name: 5. Run PHPUnit
        run: vendor/bin/phpunit

  # --- JOB #3: Scan Dependencies ---
  security_php:
    name: Scan Composer Deps
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
      - name: 2. Run Local PHP Security Checker
        uses: symfonycorp/security-checker-action@v5
        with:
          lock: ./composer.lock

  # --- JOB #4: Build and Push to Docker Hub ---
  build_and_push:
    name: Build & Push Docker Image
    needs: [run_tests, security_php] 
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 4. Extract Short SHA
        id: vars
        run: echo "sha=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT
      - name: 5. Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ambrus1996/weather-app:latest
            ambrus1996/weather-app:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- JOB #5: Security Scan (Trivy) ---
  security_scan:
    name: Scan Image (Trivy)
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
      - name: 2. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 3. Run Trivy Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ambrus1996/weather-app:${{ needs.build_and_push.outputs.sha }}'
          format: 'table'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: .trivyignore

  # --- JOB #6: DEPLOYMENT (CD) ---
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: security_scan 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/vremenska-prognoza/Vremenska-Prognoza",
              "git fetch origin main && git reset --hard origin/main",
              "echo \"--- Pulling newest images from Docker Hub --- 📥\"",
              "sudo docker-compose pull",
              "echo \"--- Restarting containers with new code --- 🚀\"",
              "sudo docker-compose up -d",
              "sudo docker image prune -f",
              "echo \"--- Deployment Finished! ---\""
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_INSTANCE_ID }}"
          
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text