name: Server - Cert Renew

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Renew certificate via SSM
        run: |
          cat > params.json <<'EOF'
          {"commands":[
            "echo === RENEW",
            "certbot renew --cert-name 13.53.32.202.nip.io --pre-hook 'docker stop weather_nginx' --post-hook 'docker start weather_nginx' 2>&1",
            "echo === NGINX; docker ps --filter name=weather_nginx --format '{{.Names}} {{.Status}}'",
            "echo === CERT; certbot certificates 2>&1 | grep -E 'Certificate Name|Expiry'",
            "echo === LIVE CHECK; echo | openssl s_client -connect 127.0.0.1:443 -servername 13.53.32.202.nip.io 2>/dev/null | openssl x509 -noout -enddate",
            "echo === AUTO RENEW; systemctl list-timers --all 2>/dev/null | grep -i certbot || echo NO_CERTBOT_TIMER; crontab -l 2>/dev/null | grep -i certbot || echo NO_CERTBOT_CRON"
          ]}
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
